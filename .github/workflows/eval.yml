name: Accuracy eval

on:
  pull_request:
  push:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Rebuild ground-truth manifest
        run: python -m eval.manifest

      - name: Run eval and gate on regression vs baseline
        run: python -m eval.run_eval --out eval/history/ci-report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/history/ci-report.json
