<!DOCTYPE html>

<body class="viz-root">

    <h1>Ground-truth review</h1>
    <p class="subtitle">Charts staged via "Save to test set&hellip;", waiting to be approved or rejected.</p>

      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="staged-list" id="staged-list"></div>
    </section>
  </main>

  <script src="/static/review.js"></script>
